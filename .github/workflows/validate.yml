name: Validar simulación SR-01

on:
  push:
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r simulacion/requirements.txt
      - name: Ejecutar escenario base
        run: python simulacion/sr01_salabim.py --scenario base
      - name: Ejecutar escenario de capacidad
        run: python simulacion/sr01_salabim.py --scenario capacity
      - name: Verificar KPI didácticos
        run: python -m unittest discover -s tests -v
